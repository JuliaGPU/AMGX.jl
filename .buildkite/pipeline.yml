steps:
  - group: ":julia: Julia"
    steps:
      - label: "Julia {{matrix.julia}}"
        plugins:
          - JuliaCI/julia#v1:
              version: "{{matrix.julia}}"
          - JuliaCI/julia-coverage#v1: ~
        agents:
          queue: "cuda"
        # The tests are run in the package's own environment rather than with
        # `Pkg.test`, because `Pkg.test` resolves into a temporary environment
        # that does not carry `LocalPreferences.toml` with it -- the CUDA
        # runtime pin below would be silently ignored and every job would test
        # whatever runtime the driver happens to support.
        commands: |
          julia --project -e '
            using Pkg
            Pkg.add(["Defer", "Test"])
            using CUDA
            CUDA.set_runtime_version!(v"12.6")'
          julia --project --code-coverage=user -e '
            using CUDA
            @assert CUDA.runtime_version() == v"12.6" "CUDA runtime pin was ignored"
            include("test/runtests.jl")'
        timeout_in_minutes: 60
        matrix:
          setup:
            julia:
              - "1.10"
              - "1.12"

  - group: "CUDA"
    steps:
      - label: "CUDA {{matrix.cuda}}"
        plugins:
          - JuliaCI/julia#v1:
              version: "1.12"
          - JuliaCI/julia-coverage#v1: ~
        agents:
          queue: "cuda"
        timeout_in_minutes: 45
        matrix:
          setup:
            cuda:
              - "13.3"
              - "13.0"
              - "12.6"
              - "12.3"
              - "12.0"
        commands: |
          julia --project -e '
            using Pkg
            Pkg.add(["Defer", "Test"])
            using CUDA
            CUDA.set_runtime_version!(v"{{matrix.cuda}}")'
          julia --project --code-coverage=user -e '
            using CUDA
            @assert CUDA.runtime_version() == v"{{matrix.cuda}}" "CUDA runtime pin was ignored"
            include("test/runtests.jl")'

