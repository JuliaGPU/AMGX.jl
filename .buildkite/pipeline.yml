steps:
  - group: ":julia: Julia"
    steps:
      - label: "Julia {{matrix.julia}}"
        plugins:
          - JuliaCI/julia#v1:
              version: "{{matrix.julia}}"
          - JuliaCI/julia-test#v1: ~
          - JuliaCI/julia-coverage#v1: ~
        agents:
          queue: "cuda"
        commands: |
          julia --project -e "
            using CUDA
            CUDA.set_runtime_version!(local_toolkit=true)"
        timeout_in_minutes: 60
        matrix:
          setup:
            julia:
              - "1.10"
              - "1.12"

  - group: "CUDA"
    steps:
      - label: "CUDA {{matrix.cuda}}"
        plugins:
          - JuliaCI/julia#v1:
              version: "1.12"
          - JuliaCI/julia-test#v1: ~
          - JuliaCI/julia-coverage#v1: ~
        agents:
          queue: "cuda"
        timeout_in_minutes: 45
        matrix:
          setup:
            cuda:
              - "12.6"
              - "12.3"
              - "12.0"
              - "11.8"
        commands: |
          julia --project -e "
            using CUDA
            CUDA.set_runtime_version!(v\"{{matrix.cuda}}\")"

